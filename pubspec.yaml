name: dapzo
description: Dapzo - Food & Meat Delivery App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # Environment Variables
  flutter_dotenv: ^5.2.1

  # Firebase
  firebase_core: ^3.15.0
  firebase_auth: ^5.6.2
  cloud_firestore: ^5.6.12
  firebase_messaging: ^15.2.10

  # State management
  provider: ^6.1.2

  # UI / Fonts
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0
  pin_code_fields: ^8.0.1
  intl: ^0.19.0

  # Location
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Networking
  http: ^1.2.1

  # Local persistence
  shared_preferences: ^2.2.2

  # Utils
  uuid: ^4.3.3

  # Toast & Assets
  fluttertoast: ^8.2.14
  image_picker: ^1.2.2
  share_plus: 12.0.2
  razorpay_flutter: ^1.4.5
  url_launcher: ^6.3.0
  sendotp_flutter_sdk: ^0.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/